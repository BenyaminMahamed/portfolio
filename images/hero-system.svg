<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Benyamin Mahamed — full-stack and AI/ML system architecture</title>
<desc>System diagram on warm parchment background showing interconnected tech stack nodes with animated data flow</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .bg{fill:#f5f0e8}.bg-warm{fill:#efe8d8}.bg-bone{fill:#f9f5ed}
    .nd{fill:#f9f5ed;stroke:#c0b8ac;stroke-width:0.5}
    .nd-accent{fill:#f9f5ed;stroke:#c8102e;stroke-width:1}
    .lbl{font-family:'DM Mono','Courier New',monospace;font-size:12px;fill:#1a1815;text-anchor:middle;dominant-baseline:middle;font-weight:500;letter-spacing:0.04em}
    .sub{font-family:'DM Mono','Courier New',monospace;font-size:9px;fill:#8a8278;text-anchor:middle;dominant-baseline:middle;letter-spacing:0.05em}
    .eyebrow{font-family:'DM Mono','Courier New',monospace;font-size:9px;fill:#c8102e;letter-spacing:0.16em}
    .stat-val{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:#1a1815;font-weight:500;letter-spacing:0.06em;text-anchor:middle}
    .stat-lbl{font-family:'DM Mono','Courier New',monospace;font-size:9px;fill:#8a8278;letter-spacing:0.08em;text-anchor:middle}
    .edge{fill:none;stroke:#c0b8ac;stroke-width:0.5}
    .edge-accent{fill:none;stroke:#c8102e;stroke-width:0.5}
    .flow{stroke-dasharray:5 4;animation:f 2.4s linear infinite}
    .flow2{stroke-dasharray:5 4;animation:f 2.4s linear 0.6s infinite}
    .flow3{stroke-dasharray:5 4;animation:f 2.4s linear 1.2s infinite}
    .flow4{stroke-dasharray:5 4;animation:f 2.4s linear 1.8s infinite}
    @keyframes f{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
    .pulse{animation:p 2s ease-in-out infinite}
    .pulse2{animation:p 2s ease-in-out 0.5s infinite}
    .pulse3{animation:p 2s ease-in-out 1s infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}
    .blink{animation:b 1.2s step-end infinite}
    @keyframes b{0%,100%{opacity:1}50%{opacity:0}}
  </style>
</defs>

<rect width="680" height="480" class="bg"/>
<rect x="0" y="0" width="680" height="48" class="bg-bone"/>
<rect x="0" y="410" width="680" height="70" class="bg-warm"/>

<line x1="0" y1="0" x2="680" y2="0" stroke="#c0b8ac" stroke-width="0.5"/>
<line x1="0" y1="48" x2="680" y2="48" stroke="#ddd8cf" stroke-width="0.5"/>
<line x1="0" y1="410" x2="680" y2="410" stroke="#ddd8cf" stroke-width="0.5"/>
<line x1="0" y1="479" x2="680" y2="479" stroke="#c0b8ac" stroke-width="0.5"/>
<line x1="600" y1="0" x2="600" y2="48" stroke="#ddd8cf" stroke-width="0.5"/>
<line x1="113" y1="410" x2="113" y2="480" stroke="#ddd8cf" stroke-width="0.5"/>
<line x1="246" y1="410" x2="246" y2="480" stroke="#ddd8cf" stroke-width="0.5"/>
<line x1="379" y1="410" x2="379" y2="480" stroke="#ddd8cf" stroke-width="0.5"/>
<line x1="512" y1="410" x2="512" y2="480" stroke="#ddd8cf" stroke-width="0.5"/>

<text x="24" y="20" class="eyebrow">System Architecture · 2026</text>
<text x="24" y="36" class="eyebrow" style="fill:#4a4540;">Benyamin Mahamed · Full-Stack · AI/ML · Embedded</text>
<circle cx="626" cy="24" r="4" fill="#c8102e" class="pulse"/>
<text x="638" y="28" class="stat-lbl" style="text-anchor:start;font-size:9px;">LIVE</text>

<rect x="40" y="72" width="140" height="54" rx="2" class="nd-accent"/>
<text x="110" y="95" class="lbl">Django</text>
<text x="110" y="112" class="sub">REST · CMS · RBAC</text>
<circle cx="52" cy="78" r="3" fill="#c8102e" class="pulse"/>

<rect x="270" y="72" width="140" height="54" rx="2" class="nd"/>
<text x="340" y="95" class="lbl">PostgreSQL</text>
<text x="340" y="112" class="sub">Prod DB · 1K+ users</text>
<circle cx="282" cy="78" r="3" fill="#c0b8ac" class="pulse2"/>

<rect x="500" y="72" width="140" height="54" rx="2" class="nd"/>
<text x="570" y="95" class="lbl">Linux · Render</text>
<text x="570" y="112" class="sub">Deploy · DNS · DMARC</text>
<circle cx="512" cy="78" r="3" fill="#c0b8ac" class="pulse3"/>

<line x1="180" y1="99" x2="270" y2="99" class="edge-accent flow" marker-end="url(#arr)"/>
<line x1="410" y1="99" x2="500" y2="99" class="edge flow2" marker-end="url(#arr)"/>
<line x1="110" y1="126" x2="110" y2="192" class="edge-accent flow3"/>
<line x1="340" y1="126" x2="340" y2="192" class="edge flow"/>
<line x1="570" y1="126" x2="570" y2="192" class="edge flow2"/>

<rect x="40" y="192" width="140" height="54" rx="2" class="nd"/>
<text x="110" y="215" class="lbl">OpenCV</text>
<text x="110" y="232" class="sub">Canny · Hough · ROI</text>
<circle cx="52" cy="198" r="3" fill="#c0b8ac" class="pulse"/>

<rect x="270" y="192" width="140" height="54" rx="2" class="nd"/>
<text x="340" y="215" class="lbl">FAISS · RAG</text>
<text x="340" y="232" class="sub">Embeddings · MiniLM</text>
<circle cx="282" cy="198" r="3" fill="#c0b8ac" class="pulse2"/>

<rect x="500" y="192" width="140" height="54" rx="2" class="nd-accent"/>
<text x="570" y="215" class="lbl">Raspberry Pi 5</text>
<text x="570" y="232" class="sub">~14 FPS · ~10ms</text>
<circle cx="512" cy="198" r="3" fill="#c8102e" class="pulse3"/>

<line x1="180" y1="219" x2="270" y2="219" class="edge flow4" marker-end="url(#arr)"/>
<line x1="410" y1="219" x2="500" y2="219" class="edge flow" marker-end="url(#arr)"/>
<line x1="110" y1="246" x2="110" y2="312" class="edge flow2"/>
<line x1="340" y1="246" x2="340" y2="312" class="edge flow3"/>
<line x1="570" y1="246" x2="570" y2="312" class="edge-accent flow4"/>

<rect x="40" y="312" width="140" height="54" rx="2" class="nd"/>
<text x="110" y="335" class="lbl">JavaScript</text>
<text x="110" y="352" class="sub">HTML · CSS · UI</text>

<rect x="270" y="312" width="140" height="54" rx="2" class="nd"/>
<text x="340" y="335" class="lbl">Git · Bash</text>
<text x="340" y="352" class="sub">GitHub · SSH · Linux</text>

<rect x="500" y="312" width="140" height="54" rx="2" class="nd-accent"/>
<text x="570" y="335" class="lbl">Python</text>
<text x="570" y="352" class="sub">Primary · 90%</text>
<circle cx="512" cy="318" r="3" fill="#c8102e" class="pulse"/>

<text x="57" y="435" class="stat-val">1,000+</text>
<text x="57" y="451" class="stat-lbl">Users</text>
<text x="180" y="435" class="stat-val">~14 FPS</text>
<text x="180" y="451" class="stat-lbl">Frame rate</text>
<text x="313" y="435" class="stat-val">~10ms</text>
<text x="313" y="451" class="stat-lbl">Latency</text>
<text x="446" y="435" class="stat-val">10,298</text>
<text x="446" y="451" class="stat-lbl">Frames</text>
<text x="596" y="432" class="eyebrow" style="text-anchor:middle;">$ python</text>
<text x="596" y="446" class="eyebrow" style="text-anchor:middle;fill:#4a4540;">manage.py</text>
<text x="596" y="460" class="eyebrow" style="text-anchor:middle;fill:#4a4540;">runserver<tspan class="blink" style="fill:#c8102e;">_</tspan></text>

</svg>
